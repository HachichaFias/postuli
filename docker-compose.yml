# Local PostgreSQL + pgvector for development (postuli) and tests (postuli_test). See ADR 002.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postuli
      POSTGRES_PASSWORD: postuli
      POSTGRES_DB: postuli
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro

volumes:
  db-data:
